name: Compiler LifeCity RP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Installer bibliotheques 32-bit pour pawncc
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y curl tar libc6:i386 libstdc++6:i386

      - name: Telecharger le compilateur et includes SA-MP
        run: |
          mkdir -p /tmp/samp_sdk
          cd /tmp/samp_sdk
          curl -fsSL --retry 3 "https://files.sa-mp.com/samp037svr_R2-1.tar.gz" -o samp037svr.tar.gz \
            || curl -fsSL --retry 3 "https://github.com/AmyrAhmady/samp-server-0.3.7-R2-1-linux/raw/master/samp037svr_R2-1.tar.gz" -o samp037svr.tar.gz \
            || curl -fsSL --retry 3 "https://assets.open.mp/samp-server/samp037svr_R2-1.tar.gz" -o samp037svr.tar.gz
          ls -lh samp037svr.tar.gz
          tar -xzf samp037svr.tar.gz
          chmod +x /tmp/samp_sdk/samp03/pawno/pawncc

      - name: Compiler LifeCity.pwn en LifeCity.amx
        run: |
          ls -la gamemodes/
          /tmp/samp_sdk/samp03/pawno/pawncc gamemodes/LifeCity.pwn \
            -i/tmp/samp_sdk/samp03/pawno/include \
            -ipawno/include \
            -iincludes \
            -ogamemodes/LifeCity.amx

      - name: Publier LifeCity.amx en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: LifeCity-AMX
          path: gamemodes/LifeCity.amx
          
