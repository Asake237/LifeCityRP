name: Compiler LifeCity RP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Installer les outils de compilation
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential curl unzip git

      - name: Compiler pawncc et recuperer les includes SA-MP
        run: |
          mkdir -p /tmp/pawn_build /tmp/pawn_sdk/include
          git clone --depth 1 https://github.com/compuphase/pawn.git /tmp/pawn_build/pawn
          cd /tmp/pawn_build/pawn/source/compiler
          make -j2
          cp pawncc /tmp/pawn_sdk/pawncc
          chmod +x /tmp/pawn_sdk/pawncc

          cd /tmp/pawn_sdk
          curl -fsSL --retry 3 -H "User-Agent: Mozilla/5.0" "https://github.com/pawn-lang/samp-stdlib/archive/refs/heads/master.zip" -o samp-stdlib.zip
          unzip -q samp-stdlib.zip
          cp -r samp-stdlib-master/* /tmp/pawn_sdk/include/

      - name: Compiler LifeCity.pwn en LifeCity.amx
        run: |
          /tmp/pawn_sdk/pawncc gamemodes/LifeCity.pwn \
            -i/tmp/pawn_sdk/include \
            -ipawno/include \
            -iincludes \
            -ogamemodes/LifeCity.amx

      - name: Publier LifeCity.amx en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: LifeCity-AMX
          path: gamemodes/LifeCity.amx
          
